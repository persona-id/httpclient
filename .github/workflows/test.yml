name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          [
          '2.5',
          '2.6',
          '2.7',
          '3.0',
          '3.1',
          '3.2',
          '3.3',
          '3.4',
          'head'
          ]
        ruby-opt: [""]
        include:
          - ruby-version: '3.4'
            ruby-opt: '--enable-frozen-string-literal --debug-frozen-string-literal'

    steps:
    - uses: actions/checkout@v3
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
        cache-version: 2
    - name: Run tests
      # Passing RUBYOPT to rake overwrites the `-rbundler/setup` that
      # `bundle exec` injects. Bundler 2.x/4.0 re-add it; the Bundler shipped
      # with ruby-head (4.1) does not, so the test process loses the bundle
      # (e.g. the git-sourced rubyntlm). Keep bundler/setup explicitly.
      run: bundle exec rake --trace RUBYOPT="-rbundler/setup ${{ matrix.ruby-opt }}"
